# Catches anything that breaks the flake's evaluation before merge: a PR
# touching the flake must still evaluate every package. Read-only: no
# builds, no cache, no write permissions.
name: nix-eval

on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Evaluate the flake's outputs
        run: |
          nix eval --raw .#openchamber-web.drvPath
          nix eval --raw .#default.drvPath
          nix flake check --no-build
